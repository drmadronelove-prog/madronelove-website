<svg width="100%" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The Process of Change</title>
<desc>Five stages of change as triangles in a row: not ready, thinking, planning, doing, maintaining.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="170" y1="210" x2="310" y2="210" stroke="#7A8898" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8" marker-end="url(#arrow)"/>
<line x1="410" y1="210" x2="550" y2="210" stroke="#7A8898" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8" marker-end="url(#arrow)"/>
<line x1="650" y1="210" x2="790" y2="210" stroke="#7A8898" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8" marker-end="url(#arrow)"/>
<line x1="890" y1="210" x2="1030" y2="210" stroke="#7A8898" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 8" marker-end="url(#arrow)"/>

<polygon points="30,280 210,280 120,140" fill="#D5DCE2" stroke="#7A8898" stroke-width="0.8"/>
<text x="120" y="258" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#2E3742">NOT READY</text>

<polygon points="270,280 450,280 360,140" fill="#B8C5D1" stroke="#5E7286" stroke-width="0.8"/>
<text x="360" y="258" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#1F2A36">THINKING</text>

<polygon points="510,280 690,280 600,140" fill="#B8C8D8" stroke="#6E869A" stroke-width="0.8"/>
<text x="600" y="258" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#1F2A36">PLANNING</text>

<polygon points="750,280 930,280 840,140" fill="#C9B687" stroke="#8A7642" stroke-width="0.8"/>
<text x="840" y="258" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#3E2F0F">DOING</text>

<polygon points="990,280 1170,280 1080,140" fill="#E0C25C" stroke="#A88420" stroke-width="0.8"/>
<text x="1080" y="258" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#3E2F0F">MAINTAINING</text>

</svg>
