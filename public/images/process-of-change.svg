<svg width="100%" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The Process of Change</title>
<desc>Five stages of change shown as circles along a wave: not ready, considering, planning, executing, maintaining.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="50" y="60" text-anchor="start" font-family="'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, serif" font-size="40" font-weight="400" font-style="italic" fill="#C5A028">The Process of Change</text>

<path d="M 195 248 C 230 233, 269 203, 300 197" fill="none" stroke="#7A8898" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.75" marker-end="url(#arrow)"/>
<path d="M 436 196 C 467 202, 505 232, 540 247" fill="none" stroke="#7A8898" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.75" marker-end="url(#arrow)"/>
<path d="M 680 247 C 715 232, 753 202, 784 196" fill="none" stroke="#7A8898" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.75" marker-end="url(#arrow)"/>
<path d="M 909 191 C 945 197, 988 233, 1027 250" fill="none" stroke="#7A8898" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8" opacity="0.75" marker-end="url(#arrow)"/>

<circle cx="120" cy="260" r="66" fill="#D5DCE2" stroke="#7A8898" stroke-width="0.8"/>
<text x="120" y="265" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#2E3742">NOT READY</text>

<circle cx="370" cy="175" r="66" fill="#B8C5D1" stroke="#5E7286" stroke-width="0.8"/>
<text x="370" y="180" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#1F2A36">CONSIDERING</text>

<circle cx="610" cy="260" r="66" fill="#B8C8D8" stroke="#6E869A" stroke-width="0.8"/>
<text x="610" y="265" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#1F2A36">PLANNING</text>

<circle cx="850" cy="175" r="66" fill="#C9B687" stroke="#8A7642" stroke-width="0.8"/>
<text x="850" y="180" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#3E2F0F">EXECUTING</text>

<circle cx="1100" cy="260" r="66" fill="#E0C25C" stroke="#A88420" stroke-width="0.8"/>
<text x="1100" y="265" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.8" fill="#3E2F0F">MAINTAINING</text>

</svg>
